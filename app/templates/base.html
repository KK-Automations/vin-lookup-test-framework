<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VIN Lookup{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/alpine.min.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-row">
            <a class="brand" href="{{ url_for('pages.index') }}">
                <span class="brand-mark" aria-hidden="true">V</span>
                <span class="brand-name">VIN Lookup</span>
            </a>
            <nav class="site-nav" aria-label="Main">
                <a href="{{ url_for('pages.index') }}">Decode</a>
                <a href="{{ url_for('pages.explore') }}">Explore</a>
                {% block nav_extra %}{% endblock %}
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>Data cross-checked across independent sources. Fields no source
            reports are shown honestly as not available.</p>
        </div>
    </footer>
</body>
</html>
